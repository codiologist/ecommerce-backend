# Local development & test services. Never used in production.
# Non-default host ports so they don't clash with other local Postgres/Redis installs.
name: ecommerce-backend

services:
  postgres:
    image: postgres:17-alpine # same major as Supabase
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_local_only
      POSTGRES_DB: ecommerce_test
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce -d ecommerce_test']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:63799:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local SMTP server + web inbox for development emails (never used in production).
  # SMTP: 127.0.0.1:1025 (no auth, no TLS)  ·  Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
