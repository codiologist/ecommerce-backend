name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values: CI never connects to a real database in Phase 0.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=app
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
